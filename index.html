<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Consulta NAP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F0F4F8;min-height:100vh}
.topbar{background:#1A73E8;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.topbar-icon{width:32px;height:32px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center}
.topbar-icon svg{width:18px;height:18px;fill:#fff}
.topbar-title{color:#fff;font-size:17px;font-weight:700}
.topbar-sub{color:rgba(255,255,255,0.8);font-size:11px;margin-top:1px}
.search-wrap{padding:16px}
.search-label{font-size:11px;color:#5F6368;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.6px}
.search-box{display:flex;gap:8px}
.search-input{flex:1;height:50px;border-radius:14px;border:1.5px solid #DADCE0;padding:0 16px;font-size:16px;background:#fff;color:#202124;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:#1A73E8;box-shadow:0 0 0 3px rgba(26,115,232,0.15)}
.search-btn{height:50px;padding:0 22px;border-radius:14px;background:#1A73E8;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.search-btn:active{background:#1558B0;transform:scale(0.97)}
.result-wrap{padding:0 16px 32px}
.empty-state{text-align:center;padding:56px 24px;color:#9AA0A6}
.empty-icon{width:56px;height:56px;fill:#DADCE0;margin:0 auto 12px;display:block}
.empty-state p{font-size:14px;line-height:1.6}
.not-found{background:#FEE8E8;border-radius:14px;padding:18px;text-align:center;color:#C5221F;font-size:14px;font-weight:500;line-height:1.5}
.result-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08),0 8px 24px rgba(0,0,0,0.04)}
.card-header{background:#1A73E8;padding:18px 16px}
.card-label{font-size:10px;color:rgba(255,255,255,0.75);font-weight:600;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px}
.card-value{font-size:24px;font-weight:800;color:#fff;letter-spacing:0.3px}
.card-dir{font-size:13px;color:rgba(255,255,255,0.85);margin-top:4px}
.card-body{padding:16px}
.info-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F1F3F4}
.info-row:last-of-type{border-bottom:none;padding-bottom:4px}
.info-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-blue{background:#E8F0FE}.ic-blue svg{fill:#1A73E8;width:18px;height:18px}
.ic-green{background:#E6F4EA}.ic-green svg{fill:#1E8E3E;width:18px;height:18px}
.info-label{font-size:10px;color:#9AA0A6;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px}
.info-value{font-size:16px;font-weight:700;color:#202124}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn-maps{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;border:none;transition:all .15s}
.btn-nap{background:#1A73E8;color:#fff}.btn-nap:active{background:#1558B0;transform:scale(0.98)}
.btn-nap svg{fill:#fff;width:18px;height:18px;flex-shrink:0}
.btn-cli{background:#fff;color:#1A73E8;border:2px solid #1A73E8}.btn-cli:active{background:#E8F0FE;transform:scale(0.98)}
.btn-cli svg{fill:#1A73E8;width:18px;height:18px;flex-shrink:0}
.coords-row{display:flex;gap:8px;margin-top:12px}
.coord-pill{flex:1;background:#F8F9FA;border-radius:10px;padding:9px 10px;text-align:center}
.coord-label{font-size:10px;color:#9AA0A6;font-weight:600;text-transform:uppercase;margin-bottom:2px}
.coord-val{font-size:11px;font-weight:700;color:#202124;font-family:monospace}
.footer{text-align:center;padding:12px 16px 24px;font-size:11px;color:#BDC1C6}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>

</div>
<div class="search-wrap">
  <div class="search-label">Número de cuenta</div>
  <div class="search-box">
    <input class="search-input" type="number" id="inp" placeholder="Ingresa el número de cuenta" inputmode="numeric" onkeydown="if(event.key==='Enter')buscar()">
    <button class="search-btn" onclick="buscar()">Buscar</button>
  </div>
</div>
<div class="result-wrap" id="result">
  <div class="empty-state">
    <svg class="empty-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    <p>Ingresa un número de cuenta<br>para consultar la NAP asignada</p>
  </div>
</div>
<div class="footer">Consulta NAP &middot; Uso interno</div>
